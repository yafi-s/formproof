name: Verify controlled local implementation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    # Public GitHub-hosted runners are free; private runs require a separate cost decision.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-optional.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/core.test.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/evaluate.mjs && node tests/parser_evaluate.mjs
      - run: python tests/browser_check.py
      - run: python tests/demo_check.py
